  <!-- COLUNA DIREITA: Mini Terminal de Execucao de Codigo / Loop de Controle -->
  <g transform="translate(560, 35)">
    <!-- Moldura do mini terminal -->
    <rect x="0" y="0" width="450" height="465" rx="6" fill="#161b22" stroke="#30363d"/>
    
    <!-- Barra superior do mini terminal -->
    <path d="M0,6 A6,6 0 0,1 6,0 L444,0 A6,6 0 0,1 450,6 L450,28 L0,28 Z" fill="#21262d"/>
    <circle cx="15" cy="14" r="4" fill="#f85149"/>
    <circle cx="28" cy="14" r="4" fill="#e3b341"/>
    <circle cx="41" cy="14" r="4" fill="#39d353"/>
    <text x="58" y="18" fill="#8b949e" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" font-size="10">bash - main_control.py</text>

    <!-- Codigo e Log do Loop de Controle -->
    <text x="15" y="52" fill="#39d353" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" font-size="11">$ python3 main_control.py</text>
    <text x="15" y="75" fill="#8b949e" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" font-size="10.5">[INIT] Loading OpenCV vision modules...</text>
    <text x="15" y="93" fill="#58a6ff" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" font-size="10.5">[OK] Camera stream online @ 60 FPS</text>
    
    <text x="15" y="120" fill="#8b949e" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" font-size="10.5">[INIT] Connecting to Siemens PLC via Modbus...</text>
    <text x="15" y="138" fill="#58a6ff" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" font-size="10.5">[OK] Modbus/TCP Link Established</text>

    <!-- Bloco de Codigo do Loop PID / Visao -->
    <text x="15" y="175" fill="#d2a8ff" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" font-size="10.5">while <tspan fill="#79c0ff">system_active</tspan>:</text>
    <text x="30" y="195" fill="#c9d1d9" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" font-size="10.5">frame = cam.<tspan fill="#79c0ff">read_frame()</tspan></text>
    <text x="30" y="215" fill="#c9d1d9" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" font-size="10.5">target = vision.<tspan fill="#79c0ff">detect_object</tspan>(frame)</text>
    <text x="30" y="235" fill="#c9d1d9" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" font-size="10.5">err = pid.<tspan fill="#79c0ff">compute_error</tspan>(target)</text>
    <text x="30" y="255" fill="#c9d1d9" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" font-size="10.5">plc.<tspan fill="#79c0ff">write_register</tspan>(<tspan fill="#a5d6ff">0x04</tspan>, err)</text>

    <!-- Log Continuo do Sistema -->
    <text x="15" y="295" fill="#8b949e" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" font-size="10">--------------------------------------</text>
    <text x="15" y="318" fill="#79c0ff" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" font-size="10.5">[LOOP #1042] Target detected: (x:120, y:84)</text>
    <text x="15" y="338" fill="#39d353" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" font-size="10.5">[PID] Error: 0.00 | Signal: 100% PWM</text>
    <text x="15" y="358" fill="#79c0ff" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" font-size="10.5">[PLC] Valve position updated</text>
    <text x="15" y="378" fill="#39d353" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" font-size="10.5">[STATUS] System running smoothly...</text>
    
    <!-- Cursor do Terminal -->
    <text x="15" y="415" fill="#39d353" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" font-size="12">> <tspan fill="#c9d1d9">_</tspan></text>
