<svg xmlns="http://www.w3.org/2000/svg" width="1048" height="540" viewBox="0 0 1048 540" role="img" aria-label="Control &amp; Automation Profile Card">
  <style>
    /* Animação do Cursor a Piscar */
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .blinking-cursor {
      animation: blink 1s infinite;
    }

    /* Animação de Aparecimento Sequencial dos Logs */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .line-1 { animation: fadeIn 0.4s ease-in 0.2s forwards; opacity: 0; }
    .line-2 { animation: fadeIn 0.4s ease-in 0.7s forwards; opacity: 0; }
    .line-3 { animation: fadeIn 0.4s ease-in 1.2s forwards; opacity: 0; }
    .line-4 { animation: fadeIn 0.4s ease-in 1.7s forwards; opacity: 0; }
    .line-5 { animation: fadeIn 0.4s ease-in 2.2s forwards; opacity: 0; }
    .line-6 { animation: fadeIn 0.4s ease-in 2.8s forwards; opacity: 0; }
    .line-7 { animation: fadeIn 0.4s ease-in 3.4s forwards; opacity: 0; }
    .line-8 { animation: fadeIn 0.4s ease-in 4.0s forwards; opacity: 0; }
    .line-9 { animation: fadeIn 0.4s ease-in 4.6s forwards; opacity: 0; }
  </style>

  <!-- Fundo Escuro -->
  <rect x="0.5" y="0.5" width="1047" height="539" rx="8" fill="#0d1117" stroke="#30363d"/>

  <!-- COLUNA ESQUERDA: Informações Profissionais -->
  <text x="35" y="45" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" font-size="12"><tspan fill="#3d444d">─</tspan><tspan fill="#58a6ff"> jota@macae </tspan><tspan fill="#3d444d">────────────────────────────────────────────</tspan></text>

  <text x="35" y="75" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" font-size="11.5"><tspan fill="#ffa657">. OS: </tspan><tspan fill="#484f58">.........................</tspan><tspan fill="#79c0ff"> Windows 11, Linux (Ubuntu), Android</tspan></text>
  <text x="35" y="98" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" font-size="11.5"><tspan fill="#ffa657">. Degree: </tspan><tspan fill="#484f58">.....................</tspan><tspan fill="#79c0ff"> Control &amp; Automation Eng. (IFF)</tspan></text>
  <text x="35" y="121" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" font-size="11.5"><tspan fill="#ffa657">. Technical: </tspan><tspan fill="#484f58">..................</tspan><tspan fill="#79c0ff"> Industrial Automation Tech (IFF)</tspan></text>
  <text x="35" y="144" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" font-size="11.5"><tspan fill="#ffa657">. Credential: </tspan><tspan fill="#484f58">.................</tspan><tspan fill="#79c0ff"> CFT Active Registration (Industrial Tech)</tspan></text>
  <text x="35" y="167" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" font-size="11.5"><tspan fill="#ffa657">. Focus: </tspan><tspan fill="#484f58">......................</tspan><tspan fill="#79c0ff"> Industrial Automation, Vision &amp; IoT</tspan></text>

  <text x="35" y="205" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" font-size="11.5"><tspan fill="#ffa657">. Languages.Programming: </tspan><tspan fill="#484f58">....</tspan><tspan fill="#79c0ff"> Python, C++, C, SQL</tspan></text>
  <text x="35" y="228" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" font-size="11.5"><tspan fill="#ffa657">. Languages.Automation: </tspan><tspan fill="#484f58">.....</tspan><tspan fill="#79c0ff"> PLCs, Ladder, TIA Portal, Studio 5000</tspan></text>
  <text x="35" y="251" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" font-size="11.5"><tspan fill="#ffa657">. Languages.Hardware: </tspan><tspan fill="#484f58">.......</tspan><tspan fill="#79c0ff"> Arduino, ESP32, Raspberry Pi, Sensors</tspan></text>
  <text x="35" y="274" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" font-size="11.5"><tspan fill="#ffa657">. Languages.Vision&amp;Tools: </tspan><tspan fill="#484f58">...</tspan><tspan fill="#79c0ff"> OpenCV, Docker, Git, Linux, LaTeX</tspan></text>
  <text x="35" y="297" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" font-size="11.5"><tspan fill="#ffa657">. Languages.Real: </tspan><tspan fill="#484f58">...........</tspan><tspan fill="#79c0ff"> Portuguese (Native), English</tspan></text>

  <text x="35" y="335" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" font-size="11.5"><tspan fill="#ffa657">. Hobbies.Software: </tspan><tspan fill="#484f58">........</tspan><tspan fill="#79c0ff"> Computer Vision, Automation Scripts</tspan></text>
  <text x="35" y="358" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" font-size="11.5"><tspan fill="#ffa657">. Hobbies.Hardware: </tspan><tspan fill="#484f58">........</tspan><tspan fill="#79c0ff"> Smart Home Devices, Electronics Repair</tspan></text>

  <text x="35" y="398" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" font-size="12"><tspan fill="#3d444d">─</tspan><tspan fill="#58a6ff"> Contact </tspan><tspan fill="#3d444d">─────────────────────────────────────────────────</tspan></text>
  <text x="35" y="423" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" font-size="11.5"><tspan fill="#ffa657">. Email.Personal: </tspan><tspan fill="#484f58">.......</tspan><tspan fill="#79c0ff"> jprochaassis@gmail.com</tspan></text>
  <text x="35" y="446" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" font-size="11.5"><tspan fill="#ffa657">. LinkedIn: </tspan><tspan fill="#484f58">.............</tspan><tspan fill="#79c0ff"> in/jprochaassis</tspan></text>

  <!-- COLUNA DIREITA: Mini Terminal Animado -->
  <g transform="translate(560, 35)">
    <!-- Moldura do Terminal -->
    <rect x="0" y="0" width="450" height="465" rx="6" fill="#161b22" stroke="#30363d"/>
    
    <!-- Barra Superior -->
    <path d="M0,6 A6,6 0 0,1 6,0 L444,0 A6,6 0 0,1 450,6 L450,28 L0,28 Z" fill="#21262d"/>
    <circle cx="15" cy="14" r="4" fill="#f85149"/>
    <circle cx="28" cy="14" r="4" fill="#e3b341"/>
    <circle cx="41" cy="14" r="4" fill="#39d353"/>
    <text x="58" y="18" fill="#8b949e" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" font-size="10">bash - main_control.py</text>

    <!-- Comando Inicial -->
    <text x="15" y="52" fill="#39d353" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" font-size="11">$ python3 main_control.py</text>
    
    <!-- Logs Animados com Fading Sequencial -->
    <text x="15" y="75" fill="#8b949e" class="line-1" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" font-size="10.5">[INIT] Loading OpenCV vision modules...</text>
    <text x="15" y="93" fill="#58a6ff" class="line-2" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" font-size="10.5">[OK] Camera stream online @ 60 FPS</text>
    
    <text x="15" y="120" fill="#8b949e" class="line-3" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" font-size="10.5">[INIT] Connecting to Siemens PLC via Modbus...</text>
    <text x="15" y="138" fill="#58a6ff" class="line-4" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" font-size="10.5">[OK] Modbus/TCP Link Established</text>

    <!-- Bloco de Código do Loop PID -->
    <g class="line-5">
      <text x="15" y="175" fill="#d2a8ff" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" font-size="10.5">while <tspan fill="#79c0ff">system_active</tspan>:</text>
      <text x="30" y="195" fill="#c9d1d9" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" font-size="10.5">frame = cam.<tspan fill="#79c0ff">read_frame()</tspan></text>
      <text x="30" y="215" fill="#c9d1d9" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" font-size="10.5">target = vision.<tspan fill="#79c0ff">detect_object</tspan>(frame)</text>
      <text x="30" y="235" fill="#c9d1d9" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" font-size="10.5">err = pid.<tspan fill="#79c0ff">compute_error</tspan>(target)</text>
      <text x="30" y="255" fill="#c9d1d9" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" font-size="10.5">plc.<tspan fill="#79c0ff">write_register</tspan>(<tspan fill="#a5d6ff">0x04</tspan>, err)</text>
    </g>

    <!-- Logs de Execução Continuados -->
    <text x="15" y="295" fill="#8b949e" class="line-6" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" font-size="10">--------------------------------------</text>
    <text x="15" y="318" fill="#79c0ff" class="line-7" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" font-size="10.5">[LOOP #1042] Target detected: (x:120, y:84)</text>
    <text x="15" y="338" fill="#39d353" class="line-8" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" font-size="10.5">[PID] Error: 0.00 | Signal: 100% PWM</text>
    <text x="15" y="358" fill="#39d353" class="line-9" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" font-size="10.5">[STATUS] System running smoothly...</text>
    
    <!-- Cursor a Piscar -->
    <text x="15" y="405" fill="#39d353" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" font-size="12">> <tspan fill="#39d353" class="blinking-cursor">_</tspan></text>
  </g>
</svg>
